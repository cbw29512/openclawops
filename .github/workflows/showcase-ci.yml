name: OpenClawOps Showcase CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate-showcase:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: dashboard/requirements.txt

      - name: Check Python syntax without running automation
        run: |
          python -m compileall -q dashboard/app scripts/validate_showcase.py

      - name: Validate approval and local-only contract
        run: python scripts/validate_showcase.py

      - name: Upload sanitized validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: openclawops-showcase-validation
          path: showcase-validation-report.json
          if-no-files-found: error
          retention-days: 30

      - name: Install dashboard and audit tooling
        run: |
          python -m pip install --upgrade pip
          pip install -r dashboard/requirements.txt pip-audit

      - name: Audit dashboard dependencies
        run: pip-audit --requirement dashboard/requirements.txt --strict
